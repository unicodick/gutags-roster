services:
  api:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      GUTAGS_DISCORD_GUILD_ID: ${GUTAGS_DISCORD_GUILD_ID:?GUTAGS_DISCORD_GUILD_ID is required}
      GUTAGS_DISCORD_TOKEN: ${GUTAGS_DISCORD_TOKEN:?GUTAGS_DISCORD_TOKEN is required}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gutags-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  gutags-data:
